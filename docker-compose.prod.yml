services:
    server:
        image: ghcr.io/gnosis/gnosis-server:latest
        container_name: gnosis-server
        restart: unless-stopped
        ports:
            - "8080:8080"
        env_file:
            - .env
        environment:
            - NODE_ENV=production
        depends_on:
            - db

    db:
        image: postgres:16-alpine
        container_name: gnosis-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - gnosis-db-data:/var/lib/postgresql/data
