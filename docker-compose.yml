services:
    db:
        image: postgres:16-alpine
        container_name: gnosis-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: gnosis_db
        ports:
            - "5432:5432"
        volumes:
            - gnosis-db-data:/var/lib/postgresql/data
volumes:
    gnosis-db-data:
